# GoReleaser configuration for FWProbe
version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: fwprobe
    main: ./cmd/fwprobe
    binary: fwprobe
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: fwprobe-archive
    format: tar.gz
    name_template: "fwprobe_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^ci:'
      - '^chore:'
      - '^test:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: mcyrrer
    name: mcfwtest
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## FWProbe {{ .Tag }}

    Firewall Rule Testing Tool

    ### Installation

    Download the appropriate binary for your platform from the assets below.

    **Linux:**
    ```bash
    curl -L https://github.com/mcyrrer/mcfwtest/releases/download/{{ .Tag }}/fwprobe_{{ .Version }}_linux_amd64.tar.gz | tar xz
    sudo mv fwprobe /usr/local/bin/
    ```

    **macOS:**
    ```bash
    curl -L https://github.com/mcyrrer/mcfwtest/releases/download/{{ .Tag }}/fwprobe_{{ .Version }}_darwin_amd64.tar.gz | tar xz
    sudo mv fwprobe /usr/local/bin/
    ```
  footer: |
    **Full Changelog**: https://github.com/mcyrrer/mcfwtest/compare/{{ .PreviousTag }}...{{ .Tag }}
